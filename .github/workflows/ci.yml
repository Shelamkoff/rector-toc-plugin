name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund --ignore-scripts --legacy-peer-deps
      - run: npm test
      - run: npm pack --dry-run

  rector-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Shelamkoff/editor
          ref: refactor/rector-v2-architecture
          path: rector
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rector v2 dependencies
        run: npm ci --prefix rector
      - name: Install TOC dependencies
        run: npm install --no-audit --no-fund --ignore-scripts --legacy-peer-deps
      - name: Check declarations against Rector v2 contracts
        run: node rector/node_modules/typescript/bin/tsc -p tsconfig.integration.json
      - name: Verify with real Rector v2 in Chromium
        run: node test/browser/run.mjs
      - name: Verify consumer installation from npm tarballs
        run: node test/package-consumer.mjs
