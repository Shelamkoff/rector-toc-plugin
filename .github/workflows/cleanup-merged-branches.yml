name: Clean up merged audit branches (one-time)

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cleanup-merged-branches.yml'

permissions:
  contents: write

jobs:
  remove-merged-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Delete only fully merged audit refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/audit/*:refs/remotes/origin/audit/*'
          mapfile -t branches < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/audit)
          echo "Found ${#branches[@]} audit branches."
          for branch in "${branches[@]}"; do
            [[ "$branch" == audit/* ]] || { echo "::error::Unexpected branch name $branch"; exit 1; }
            if ! git merge-base --is-ancestor "refs/remotes/origin/$branch" "$GITHUB_SHA"; then
              echo "::error::Unmerged work in $branch; refusing deletion."
              exit 1
            fi
          done
          for branch in "${branches[@]}"; do
            git push origin --delete "$branch"
            echo "Deleted merged branch: $branch"
          done
          remaining="$(git ls-remote --heads origin 'refs/heads/audit/*')"
          if [[ -n "$remaining" ]]; then
            echo "::error::Some audit branches remain: $remaining"
            exit 1
          fi
          echo "Successfully removed ${#branches[@]} audit branches."
